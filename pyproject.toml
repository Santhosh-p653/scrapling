[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scrapling-knowledge-engine"
version = "0.1.0"
description = "FastMCP server for knowledge ingestion — web scraping, GitHub, API introspection"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.4.0",
    "scrapling>=0.3.0",
    "patchright",
    "duckduckgo_search>=7.0.0",
    "markdownify>=0.13.0",
    "uvicorn>=0.30.0",
    "requests",
    "curl_cffi",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "pytest-mock",
]

# ---------------------------------------------------------------------------
# Pytest configuration
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--tb=short",
    "--strict-markers",
    "-q",
]

# ---------------------------------------------------------------------------
# Coverage configuration
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["app"]
omit = [
    "app/__init__.py",
    "app/tools/__init__.py",
]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
exclude_lines = [
    # Standard pragmas
    "pragma: no cover",

    # Abstract/protocol stubs
    "raise NotImplementedError",

    # Defensive unreachable branches
    "if TYPE_CHECKING:",

    # Main guard
    'if __name__ == "__main__":',
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"